---
- name: Crear directorio de provisioning de Grafana
  file:
    path: /opt/monitoring/grafana/provisioning/datasources
    state: directory
    mode: "0755"

- name: Copiar el datasource de Prometheus (auto-configurado)
  copy:
    src: datasource.yml
    dest: /opt/monitoring/grafana/provisioning/datasources/datasource.yml
    mode: "0644"

- name: Ejecutar el contenedor de Grafana
  community.docker.docker_container:
    name: "{{ grafana_container }}"
    image: "{{ grafana_image }}"
    state: started
    restart_policy: unless-stopped
    recreate: true
    networks:
      - name: "{{ docker_network }}"
    ports:
      - "{{ grafana_port }}:3000"
    env:
      GF_SECURITY_ADMIN_USER: "{{ grafana_admin_user }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"

      # SMTP configuration for email alerts
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: "{{ grafana_smtp_user }}"
      GF_SMTP_PASSWORD: "{{ grafana_smtp_password }}"
      GF_SMTP_FROM_ADDRESS: "{{ grafana_smtp_user }}"
      GF_SMTP_FROM_NAME: "Grafana Alerts"

    volumes:
      - /opt/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - /opt/monitoring/grafana/data:/var/lib/grafana