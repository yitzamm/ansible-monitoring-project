---
- name: Instalar dependencias base
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
    state: present
    update_cache: true

- name: Crear directorio para la llave GPG de Docker
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Descargar la llave GPG de Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Detectar la arquitectura de dpkg
  command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: Agregar el repositorio oficial de Docker
  apt_repository:
    repo: >-
      deb [arch={{ dpkg_arch.stdout }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Instalar Docker Engine y complementos
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

#This is the Debian/Ubuntu-recommended way and avoids the whole PEP 668 issue
- name: Instalar el SDK de Docker para Python
  apt:
    name:
      - python3-docker
      - python3-requests
    state: present
    update_cache: true

- name: Asegurar que el servicio Docker este iniciado y habilitado
  service:
    name: docker
    state: started
    enabled: true

- name: Agregar el usuario al grupo docker (para usar docker sin sudo)
  user:
    name: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    groups: docker
    append: true

- name: Crear la red de Docker del proyecto
  community.docker.docker_network:
    name: "{{ docker_network }}"
    state: present